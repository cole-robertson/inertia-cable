name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruby-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec rspec

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        inertia: [locked, '3.0.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install minimum supported Inertia version
        if: matrix.inertia != 'locked'
        run: npm install --no-save --package-lock=false @inertiajs/react@${{ matrix.inertia }} @inertiajs/core@${{ matrix.inertia }}
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: Verify ESM package import
        run: node --input-type=module -e "import('@inertia-cable/react')"
        working-directory: frontend

      - run: npm ci
        working-directory: integration_test

      - run: npm run check
        working-directory: integration_test

      - run: npx vite build
        working-directory: integration_test

      - run: npx vite build --ssr
        working-directory: integration_test
